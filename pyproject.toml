[project]
name = "npsweather"
version = "0.1.0"
description = "CIS 635 project: monthly NPS visitation linked to NOAA GHCN-Daily weather"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[project.scripts]
npsw = "npsweather.pipeline:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ipykernel>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/npsweather"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
